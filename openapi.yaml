      properties:
        count:
          type: integer
          example: 1240
        next:
          type: string
          format: uri
          nullable: true
          example: "http://127.0.0.1:8000/api/certificates/?page=2"
        previous:
          type: string
          format: uri
          nullable: true
          example: null
        results:
          type: array
          items:
            $ref: '#/components/schemas/Certificate'
    PaginatedVerificationRecords:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          example: 382
        next:
          type: string
          format: uri
          nullable: true
          example: "http://127.0.0.1:8000/api/verification-history/?page=2"
        previous:
          type: string
          format: uri
          nullable: true
          example: null
        results:
          type: array
          items:
            $ref: '#/components/schemas/VerificationRecord'
    PaginatedAuditEntries:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          example: 89
        next:
          type: string
          format: uri
          nullable: true
          example: "http://127.0.0.1:8000/api/audit-log/?page=2"
        previous:
          type: string
          format: uri
          nullable: true
          example: null
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          example: "Validation failed for submitted payload."
          description: High-level descriptive error summary
        errors:
          type: object
          additionalProperties: true
          example:
            holder_name:
              - "This field is required."
            issue_date:
              - "Date cannot be in the future."
          description: Field-level validation error messages
  responses:
    BadRequest:
      description: Bad Request - Request payload or query validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Authentication credentials are missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - Authenticated user lacks sufficient permissions for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found - The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict - A resource with the specified identifier or unique constraint already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error - An unexpected condition occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
